[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --alluredir=./allure-results
    --clean-alluredir
    --import-mode=importlib

testpaths = tests
pythonpath = .

markers =
    cart: cart page tests
    category: category page tests
    product: product page tests
    critical: high-priority happy-path scenarios
    medium: boundary and secondary scenarios
    smoke: minimal smoke suite
    negative: invalid or resilience input handling
    regression: cross-page and persistence scenarios
    mobile: mobile viewport (~390x844) smoke scenarios
